[project]
name = "physicsos"
version = "0.1.31"
description = "AI-native physics simulation OS with TAPS-first physics IR, solver planning, and cloud runner tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "deepagents",
  # The CLI integration patches private APIs from this release.
  "deepagents-cli==0.0.46",
  "langgraph",
  "langchain-openai",
  "rich>=13.7",
  "textual>=8,<9",
  "httpx>=0.28,<1",
  "gmsh>=4.13",
  "meshio>=5.3",
  "trimesh>=4.4,<5",
  "rtree>=1.3,<2",
  "pymatgen>=2025.6",
  "seekpath>=2.1",
  "spglib>=2.5",
]
keywords = ["physics", "simulation", "pde", "fem", "agents", "neural-operator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
physicsos = "physicsos.cli:main"

[project.urls]
Homepage = "https://github.com/fzj1214/PhysicsOS"
Repository = "https://github.com/fzj1214/PhysicsOS"
Documentation = "https://github.com/fzj1214/PhysicsOS#readme"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
agents = []
geometry = []
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]
all = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["physicsos*"]
exclude = ["runners*", "data*", "models*", "configs*", "scratch*", "docs*", "scripts*", "tests*", "examples*"]

[tool.setuptools.package-data]
physicsos = ["references/*.md"]
